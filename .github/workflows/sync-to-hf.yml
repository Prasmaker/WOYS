name: Sync to Hugging Face Space

on:
  push:
    branches:
      - main          # fires every time you push to main
  workflow_dispatch:  # lets you trigger it manually from GitHub Actions tab

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, not just latest commit
          lfs: true        # include any large files if added later

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push https://Prasmaker:$HF_TOKEN@huggingface.co/spaces/Prasmaker/WOYS main
